<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Publishing a payload with release and acquire</title>
  <desc id="desc">Producer writes payload = 42 before storing true to ready with release. Consumer repeatedly loads ready with acquire until it reads that true, then reads payload. That release store synchronizes with the successful acquire load, establishing a happens-before relationship between the payload write and read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#606744"/></marker>
  </defs>
  <rect width="900" height="640" fill="#f1eee6"/>
  <g font-family="Georgia, serif" fill="#292d25">
    <text x="36" y="47" font-size="28">The flag publishes the payload</text>
  </g>
  <g font-family="monospace" font-size="17" fill="#292d25">
    <text x="36" y="82" font-size="14" fill="#555c4e">ONE PRODUCER · ONE CONSUMER · ONE HANDOFF</text>
    <text x="60" y="134" font-size="17">PRODUCER</text>
    <text x="516" y="134" font-size="17">CONSUMER</text>
    <g fill="#e4e6d8" stroke="#606744" stroke-width="1.5">
      <rect x="36" y="156" width="344" height="96"/>
      <rect x="36" y="340" width="344" height="96"/>
      <rect x="492" y="156" width="372" height="96" fill="#f1eee6" stroke-dasharray="5 4"/>
      <rect x="492" y="340" width="372" height="96"/>
      <rect x="492" y="498" width="372" height="78"/>
    </g>
    <text x="58" y="190">payload = 42;</text>
    <text x="58" y="224" font-size="14">Ordinary, non-atomic write</text>
    <text x="58" y="376">ready.store(true,</text>
    <text x="58" y="409">  memory_order_release);</text>
    <text x="514" y="190">ready.load(acquire) → false</text>
    <text x="514" y="224" font-size="14">Keep waiting; do not read payload</text>
    <text x="514" y="376">ready.load(acquire) → true</text>
    <text x="514" y="409" font-size="14">Reads this release store</text>
    <text x="514" y="530">Read payload → 42</text>
    <text x="514" y="557" font-size="14">No later producer writes</text>
    <g stroke="#606744" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M208 254 V334"/>
      <path d="M678 254 V334"/>
      <path d="M678 438 V492"/>
      <path d="M382 387 H486" stroke-width="3"/>
    </g>
    <text x="58" y="294" font-size="13">sequenced before</text>
    <text x="514" y="294" font-size="13">repeat until true</text>
    <text x="514" y="473" font-size="13">sequenced before</text>
    <text x="36" y="490" font-size="16" fill="#4d5735">release → acquire</text>
    <text x="36" y="518" font-size="14">synchronizes with</text>
    <text x="36" y="552" font-size="13">The payload stays in shared memory.</text>
    <path d="M36 598 H864" stroke="#b8bbaa"/>
    <text x="36" y="624" font-size="15">Therefore: payload write happens before payload read.</text>
  </g>
</svg>
